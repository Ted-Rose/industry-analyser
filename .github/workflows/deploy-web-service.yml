name: Deploy Django Web Service to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - '*.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'industry_analyser/**'
      - 'classified_ads/**'
      - 'fetcher/**'
      - 'tv_programs/**'
      - 'blogs/**'
      - 'accounts/**'
      - 'staticfiles/**'
      - 'frontend/**'
      - '.github/workflows/deploy-web-service.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-service-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: europe-north1
  SERVICE_NAME: industry-analyser

jobs:
  build-and-deploy:
    # Prod deploy: pushes to main and manual runs on main. A
    # workflow_dispatch from a feature branch skips this job —
    # prod must never get unmerged code.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Production env's main-only branch policy is enforced
    # server-side — covers stale branches whose YAML lacks the `if`
    # above (the env key itself is still YAML: defense-in-depth, not
    # a hard boundary).
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: >-
          gcloud auth configure-docker
          ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push web service image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          AR="${REGION}-docker.pkg.dev/${PROJECT_ID}"
          AR="${AR}/industry-analyser-app"
          IMAGE="${AR}/${SERVICE_NAME}"
          docker build -t "${IMAGE}:web-${GITHUB_SHA}" \
                     -t "${IMAGE}:web-latest" .
          docker push "${IMAGE}:web-${GITHUB_SHA}"
          docker push "${IMAGE}:web-latest"

      - name: Run database migrations
        # Main only: a workflow_dispatch from a feature branch must
        # not run unmerged migration files against the prod DB (same
        # guard as Terraform apply in deploy-scraper-jobs.yml).
        if: github.ref == 'refs/heads/main'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          AR="${REGION}-docker.pkg.dev/${PROJECT_ID}"
          AR="${AR}/industry-analyser-app"
          IMAGE="${AR}/${SERVICE_NAME}:web-${GITHUB_SHA}"

          # Apply migrations BEFORE the new revision serves traffic —
          # a failed migrate fails this step and aborts the deploy.
          # The job is created/updated ad-hoc from the just-pushed
          # image (so it runs this commit's migration files) with the
          # same env-file secret as the service; it is intentionally
          # not terraform-managed. `migrate` is a fast no-op when
          # nothing is pending. Caveat: if `migrate` succeeds but the
          # service deploy below fails, prod schema is ahead of the
          # running code — keep migrations backward-compatible.
          gcloud run jobs deploy run-migrations \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --command=python \
            --args=manage.py,migrate \
            --set-secrets="DOTENV=env-file:latest" \
            --task-timeout=3600 \
            --max-retries=0 \
            --quiet

          # --wait propagates the execution's exit status.
          gcloud run jobs execute run-migrations \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --wait \
            --quiet

      - name: Deploy to Cloud Run Service
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          AR="${REGION}-docker.pkg.dev/${PROJECT_ID}"
          AR="${AR}/industry-analyser-app"
          IMAGE="${AR}/${SERVICE_NAME}:web-${GITHUB_SHA}"

          # All runtime config lives in the single `env-file` secret
          # (full .env payload injected as DOTENV; settings.py loads it).
          gcloud run deploy ${SERVICE_NAME} \
            --image="${IMAGE}" \
            --platform=managed \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300 \
            --set-secrets="DOTENV=env-file:latest" \
            --quiet

      - name: Get Service URL
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          SERVICE_URL=$(gcloud run services describe ${SERVICE_NAME} \
            --platform=managed \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format='value(status.url)')
          echo "🚀 Service deployed successfully!"
          echo "📍 Service URL: ${SERVICE_URL}"
          echo "SERVICE_URL=${SERVICE_URL}" >> $GITHUB_ENV

      - name: Run health check
        run: |
          echo "Waiting 10 seconds for service to be ready..."
          sleep 10

          echo "Running health check on ${SERVICE_URL}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            ${SERVICE_URL} || echo "000")

          if [ "$HTTP_CODE" = "200" ] || \
             [ "$HTTP_CODE" = "301" ] || \
             [ "$HTTP_CODE" = "302" ]; then
            echo "✅ Health check passed (HTTP ${HTTP_CODE})"
          else
            echo "⚠️  Health check returned HTTP ${HTTP_CODE}"
            echo "May be expected when the home page requires auth"
          fi

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Service**: ${SERVICE_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Region**: ${REGION}" >> $GITHUB_STEP_SUMMARY
          AR="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app"
          echo "✅ **Image**: ${AR}/${SERVICE_NAME}:web-${GITHUB_SHA}" \
            >> $GITHUB_STEP_SUMMARY
          echo "✅ **Min Instances**: 0" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Max Instances**: 1" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Memory**: 512Mi" >> $GITHUB_STEP_SUMMARY
          echo "✅ **CPU**: 1" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Service URL**: ${SERVICE_URL}" >> $GITHUB_STEP_SUMMARY
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

