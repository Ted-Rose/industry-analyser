name: Deploy Django Web Service to Cloud Run

on:
  push:
    branches:
      - master
    paths:
      - '**/*.py'
      - '*.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'industry_analyser/**'
      - 'classified_ads/**'
      - 'fetcher/**'
      - 'tv_programs/**'
      - 'blogs/**'
      - 'accounts/**'
      - 'staticfiles/**'
      - 'frontend/**'
      - '.github/workflows/deploy-web-service.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - '**/*.py'
      - '*.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'industry_analyser/**'
      - 'classified_ads/**'
      - 'fetcher/**'
      - 'tv_programs/**'
      - 'blogs/**'
      - 'accounts/**'
      - 'staticfiles/**'
      - 'frontend/**'
      - '.github/workflows/deploy-web-service.yml'
  workflow_dispatch:
    inputs:
      service_suffix:
        description: >-
          Suffix appended to the staging service name
          (industry-analyser<suffix>). Empty = deploy prod only.
        required: false
        default: '-staging'

concurrency:
  group: deploy-web-service-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: europe-north1
  SERVICE_NAME: industry-analyser

jobs:
  build-and-deploy:
    # Prod deploy: pushes to master and manual runs. PRs only get the
    # staging deploy below.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push web service image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/${SERVICE_NAME}"
          docker build -t "${IMAGE}:web-${GITHUB_SHA}" -t "${IMAGE}:web-latest" .
          docker push "${IMAGE}:web-${GITHUB_SHA}"
          docker push "${IMAGE}:web-latest"

      - name: Deploy to Cloud Run Service
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/${SERVICE_NAME}:web-${GITHUB_SHA}"

          # All runtime config lives in the single `env-file` secret
          # (full .env payload injected as DOTENV; settings.py loads it).
          gcloud run deploy ${SERVICE_NAME} \
            --image="${IMAGE}" \
            --platform=managed \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300 \
            --set-secrets="DOTENV=env-file:latest" \
            --quiet

      - name: Get Service URL
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          SERVICE_URL=$(gcloud run services describe ${SERVICE_NAME} \
            --platform=managed \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format='value(status.url)')
          echo "🚀 Service deployed successfully!"
          echo "📍 Service URL: ${SERVICE_URL}"
          echo "SERVICE_URL=${SERVICE_URL}" >> $GITHUB_ENV

      - name: Run health check
        run: |
          echo "Waiting 10 seconds for service to be ready..."
          sleep 10

          echo "Running health check on ${SERVICE_URL}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${SERVICE_URL} || echo "000")

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "✅ Health check passed (HTTP ${HTTP_CODE})"
          else
            echo "⚠️  Health check returned HTTP ${HTTP_CODE}"
            echo "This might be expected if the home page requires authentication"
          fi

      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Service**: ${SERVICE_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Region**: ${REGION}" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Image**: ${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/${SERVICE_NAME}:web-${GITHUB_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Min Instances**: 0" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Max Instances**: 1" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Memory**: 512Mi" >> $GITHUB_STEP_SUMMARY
          echo "✅ **CPU**: 1" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Service URL**: ${SERVICE_URL}" >> $GITHUB_STEP_SUMMARY
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

  deploy-staging:
    # Ephemeral PRIVATE staging service for PRs
    # (industry-analyser-pr-<num>) and manual runs
    # (industry-analyser<service_suffix>, default -staging). Same
    # image + env-file secret as prod; scales to zero. --no-allow-
    # unauthenticated means the URL 403s at Google's edge — a public
    # preview cannot be abused into spend. Browse it via
    # `gcloud run services proxy` (needs roles/run.invoker). PR
    # previews are deleted by the cleanup job when the PR closes;
    # manual-dispatch staging is not auto-deleted — remove it with
    # `gcloud run services delete` when done.
    if: >
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.service_suffix != '')
    runs-on: ubuntu-latest
    env:
      STAGING_NAME: >-
        ${{ github.event_name == 'pull_request' &&
        format('industry-analyser-pr-{0}', github.event.pull_request.number)
        || format('industry-analyser{0}', inputs.service_suffix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push staging image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/${SERVICE_NAME}"
          docker build -t "${IMAGE}:staging-${GITHUB_SHA}" .
          docker push "${IMAGE}:staging-${GITHUB_SHA}"

      - name: Deploy staging service
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/${SERVICE_NAME}:staging-${GITHUB_SHA}"

          gcloud run deploy "${STAGING_NAME}" \
            --image="${IMAGE}" \
            --platform=managed \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --no-allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300 \
            --set-secrets="DOTENV=env-file:latest" \
            --quiet

      # Private service: let the deploy SA invoke it so the smoke
      # check below can prove the container actually boots.
      - name: Grant deploy SA invoker access
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          DEPLOYER=$(gcloud auth list \
            --filter=status:ACTIVE --format='value(account)')
          gcloud run services add-iam-policy-binding "${STAGING_NAME}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --member="serviceAccount:${DEPLOYER}" \
            --role="roles/run.invoker" \
            --quiet

      - name: Smoke check (authenticated)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          SERVICE_URL=$(gcloud run services describe "${STAGING_NAME}" \
            --platform=managed \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format='value(status.url)')
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $(gcloud auth print-identity-token)" \
            "${SERVICE_URL}/admin/login/")
          echo "GET /admin/login/ -> ${CODE}"
          test "${CODE}" = "200"

      - name: Staging deployment summary
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          SERVICE_URL=$(gcloud run services describe "${STAGING_NAME}" \
            --platform=managed \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format='value(status.url)')
          echo "🚀 Staging deployed (private): ${SERVICE_URL}"
          {
            echo "## Staging Deployment"
            echo ""
            echo "✅ **Service**: ${STAGING_NAME}"
            echo "✅ **Min Instances**: 0 (scales to zero)"
            echo "🔒 **Private**: unauthenticated → 403 at edge"
            echo "🌐 **Service URL**: ${SERVICE_URL}"
            echo "Browse via \`gcloud run services proxy ${STAGING_NAME} --region=${REGION} --project=${PROJECT_ID}\`"
          } >> $GITHUB_STEP_SUMMARY

  cleanup-staging:
    # Delete the PR's preview service when the pull request closes
    # (merged or not) so previews never outlive their review.
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      STAGING_NAME: >-
        ${{ format('industry-analyser-pr-{0}',
        github.event.pull_request.number) }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Delete staging service
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run services delete "${STAGING_NAME}" \
            --platform=managed \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --quiet \
            || echo "Service ${STAGING_NAME} not found - nothing to delete"
