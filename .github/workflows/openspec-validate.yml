name: OpenSpec validate

# Validates the repo-root openspec/ specs and change proposals on
# every PR and every push to main — strict mode fails on
# requirement-format and spec/delta drift.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openspec-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install OpenSpec CLI
        run: >-
          npm install -g --ignore-scripts --no-audit --no-fund
          @fission-ai/openspec@1.14.3

      - name: Validate specs
        run: openspec validate --all --strict
