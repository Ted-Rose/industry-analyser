name: Frontend checks

# Runs the SPA toolchain on every PR and every push to master —
# including regenerating the committed OpenAPI schema + api-types.ts
# so schema/type drift fails the check.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install npm dependencies
        working-directory: frontend
        # --include=dev: parity with build_files.sh/Dockerfile —
        # tsc/vite/vitest live in devDependencies.
        run: npm ci --include=dev

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Regenerate openapi.json + api-types.ts (drift check)
        env:
          SECRET_KEY: ci-build-dummy-secret
          DATABASE_URL: sqlite:///db.sqlite3
          DEBUG: 'False'
          BASE_URL: http://localhost
        run: |
          set -euo pipefail
          python manage.py export_openapi_schema \
            --output frontend/openapi.json
          printf '\n' >> frontend/openapi.json
          (cd frontend && npm run gen:types)
          git diff --exit-code
