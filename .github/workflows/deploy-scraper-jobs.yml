name: Deploy scraper jobs (Artifact Registry + Cloud Run)

on:
  push:
    branches:
      - master
    paths:
      - '**/*.py'
      - '*.py'
      - 'scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - '.github/workflows/deploy-scraper-jobs.yml'
      - 'terraform/**/*.tf'
      - 'terraform/**/*.tfvars'
      - 'terraform/.terraform.lock.hcl'
  workflow_dispatch:

concurrency:
  group: deploy-scraper-jobs-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: europe-north1

jobs:
  provision-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.3.0

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_scheduler_region: europe-west1
          TF_VAR_secret_key: ${{ secrets.TF_VAR_secret_key }}
          TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
          TF_VAR_base_url: ${{ secrets.TF_VAR_base_url }}
          TF_VAR_db_ssl_cert: ${{ secrets.TF_VAR_db_ssl_cert }}
          TF_VAR_hard_coded_password: ${{ secrets.TF_VAR_hard_coded_password }}
          TF_VAR_gemini_api_key: ${{ secrets.TF_VAR_gemini_api_key }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/master'
        working-directory: ./terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_scheduler_region: europe-west1
          TF_VAR_secret_key: ${{ secrets.TF_VAR_secret_key }}
          TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
          TF_VAR_base_url: ${{ secrets.TF_VAR_base_url }}
          TF_VAR_db_ssl_cert: ${{ secrets.TF_VAR_db_ssl_cert }}
          TF_VAR_hard_coded_password: ${{ secrets.TF_VAR_hard_coded_password }}
          TF_VAR_gemini_api_key: ${{ secrets.TF_VAR_gemini_api_key }}
        run: terraform apply -auto-approve tfplan

      - name: Output Resources
        if: github.ref == 'refs/heads/master'
        working-directory: ./terraform
        run: terraform output

  build-and-push:
    needs: [provision-infrastructure]
    if: always() && (needs.provision-infrastructure.result == 'success' || needs.provision-infrastructure.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/industry-analyser"
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  update-job-images:
    needs: [provision-infrastructure, build-and-push]
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    env:
      REGION: europe-north1
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Update Cloud Run job images
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/industry-analyser:${GITHUB_SHA}"

          # Helper function to update job only if it exists
          update_job_if_exists() {
            local job_name=$1
            shift
            if gcloud run jobs describe "${job_name}" --region="${REGION}" --project="${PROJECT_ID}" &>/dev/null; then
              echo "Updating job: ${job_name}"
              gcloud run jobs update "${job_name}" "$@" --region="${REGION}" --project="${PROJECT_ID}" --quiet
            else
              echo "Skipping ${job_name} (not created yet - will be created by Terraform)"
            fi
          }

          # Vacancy scraper: write config from Secret Manager env, then run management command
          update_job_if_exists scrape-vacancy \
            --image="${IMAGE}" \
            --command=python3 \
            --args=scripts/materialize_fetcher_config_and_scrape.py

          # TV scraper: standard Django entrypoint
          update_job_if_exists scrape-tv-programs \
            --image="${IMAGE}" \
            --command=python \
            --args=manage.py,scrape_tv_programs

          # Classified ads scraper: standard Django entrypoint
          update_job_if_exists scrape-classified-ads \
            --image="${IMAGE}" \
            --command=python \
            --args=manage.py,scrape_classified_ads

          # Housing ads scraper: standard Django entrypoint
          update_job_if_exists scrape-housing-ads \
            --image="${IMAGE}" \
            --command=python \
            --args=manage.py,scrape_housing_ads

          # Region sync: fetches ss.com region list and upserts into DB
          update_job_if_exists sync-regions \
            --image="${IMAGE}" \
            --command=python \
            --args=manage.py,sync_apartment_regions

          # Housing region sync: fetches ss.com housing region list and upserts into DB
          update_job_if_exists sync-housing-regions \
            --image="${IMAGE}" \
            --command=python \
            --args=manage.py,sync_housing_regions
