name: Deploy scraper jobs (Artifact Registry + Cloud Run)

on:
  push:
    branches:
      - master
    paths:
      - '**/*.py'
      - '*.py'
      - 'scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - '.github/workflows/deploy-scraper-jobs.yml'
      - 'terraform/**/*.tf'
      - 'terraform/**/*.tfvars'
      - 'terraform/.terraform.lock.hcl'
  workflow_dispatch:

concurrency:
  group: deploy-scraper-jobs-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: europe-north1

jobs:
  provision-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.3.0

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_scheduler_region: europe-west1
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/master'
        working-directory: ./terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_scheduler_region: europe-west1
        run: terraform apply -auto-approve tfplan

      - name: Output Resources
        if: github.ref == 'refs/heads/master'
        working-directory: ./terraform
        run: terraform output

  build-and-push:
    needs: [provision-infrastructure]
    if: always() && (needs.provision-infrastructure.result == 'success' || needs.provision-infrastructure.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/industry-analyser"
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  update-job-images:
    needs: [provision-infrastructure, build-and-push]
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    env:
      REGION: europe-north1
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Update Cloud Run job images
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Jobs must point at the moving `latest` tag, not ${GITHUB_SHA}:
          # sha tags are deleted by the AR cleanup policy (24h) and by
          # cleanup-artifacts.yml, so a job pinned to a sha tag ends up
          # referencing a dead image — updates fail with "Image not found"
          # and scheduled executions break. `latest` shares the sha tag's
          # digest, so the pushed image is identical; the sha tag push above
          # remains for auditability.
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/industry-analyser:latest"

          # Helper function to update job only if it exists
          update_job_if_exists() {
            local job_name=$1
            shift
            if gcloud run jobs describe "${job_name}" --region="${REGION}" --project="${PROJECT_ID}" &>/dev/null; then
              echo "Updating job: ${job_name}"
              gcloud run jobs update "${job_name}" "$@" --region="${REGION}" --project="${PROJECT_ID}" --quiet
            else
              echo "Skipping ${job_name} (not created yet - will be created by Terraform)"
            fi
          }

          # Master job: sequential run of all enabled sub-jobs
          # (JOBS list in scrape_jobs/management/commands/run_all_jobs.py).
          # This is the only remaining Cloud Run job — the former
          # per-task jobs were removed in the Phase-2 consolidation.
          update_job_if_exists all-jobs \
            --image="${IMAGE}" \
            --command=python \
            --args=manage.py,run_all_jobs
