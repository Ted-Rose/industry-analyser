name: Deploy scraper jobs (Artifact Registry + Cloud Run)

on:
  push:
    branches:
      - master
    paths:
      - '**/*.py'
      - '*.py'
      - 'scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - '.github/workflows/deploy-scraper-jobs.yml'
      - 'terraform/**/*.tf'
      - 'terraform/**/*.tfvars'
      - 'terraform/.terraform.lock.hcl'
  workflow_dispatch:

concurrency:
  group: deploy-scraper-jobs-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: europe-north1

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'terraform/') || contains(github.event.head_commit.added, 'terraform/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.3.0

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_scheduler_region: europe-west1
          TF_VAR_secret_key: ${{ secrets.TF_VAR_secret_key }}
          TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
          TF_VAR_base_url: ${{ secrets.TF_VAR_base_url }}
          TF_VAR_db_ssl_cert: ${{ secrets.TF_VAR_db_ssl_cert }}
          TF_VAR_hard_coded_password: ${{ secrets.TF_VAR_hard_coded_password }}
          TF_VAR_gemini_api_key: ${{ secrets.TF_VAR_gemini_api_key }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/master'
        working-directory: ./terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.REGION }}
          TF_VAR_scheduler_region: europe-west1
          TF_VAR_secret_key: ${{ secrets.TF_VAR_secret_key }}
          TF_VAR_database_url: ${{ secrets.TF_VAR_database_url }}
          TF_VAR_base_url: ${{ secrets.TF_VAR_base_url }}
          TF_VAR_db_ssl_cert: ${{ secrets.TF_VAR_db_ssl_cert }}
          TF_VAR_hard_coded_password: ${{ secrets.TF_VAR_hard_coded_password }}
          TF_VAR_gemini_api_key: ${{ secrets.TF_VAR_gemini_api_key }}
        run: terraform apply -auto-approve tfplan

      - name: Output Resources
        if: github.ref == 'refs/heads/master'
        working-directory: ./terraform
        run: terraform output

  build-and-push:
    needs: [terraform-apply]
    if: always() && (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/industry-analyser"
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  deploy:
    needs: [terraform-apply, build-and-push]
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    env:
      REGION: europe-north1
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Update Cloud Run job images
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/industry-analyser:${GITHUB_SHA}"

          # Vacancy scraper: write config from Secret Manager env, then run management command
          gcloud run jobs update scrape-vacancy \
            --image="${IMAGE}" \
            --command=python3 \
            --args=scripts/materialize_fetcher_config_and_scrape.py \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --quiet

          # TV scraper: standard Django entrypoint
          gcloud run jobs update scrape-tv-programs \
            --image="${IMAGE}" \
            --command=python \
            --args=manage.py,scrape_tv_programs \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --quiet

          # Classified ads scraper: standard Django entrypoint
          gcloud run jobs update scrape-classified-ads \
            --image="${IMAGE}" \
            --command=python \
            --args=manage.py,scrape_classified_ads \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --quiet
