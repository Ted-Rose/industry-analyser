name: Deploy scraper jobs (Artifact Registry + Cloud Run)

on:
  push:
    branches:
      - master
    paths:
      - '**/*.py'
      - '*.py'
      - 'scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - '.github/workflows/deploy-scraper-jobs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-scraper-jobs-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: europe-north1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/industry-analyser"
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      REGION: europe-north1
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Update Cloud Run job images
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/industry-analyser:${GITHUB_SHA}"

          # Vacancy scraper: write config from Secret Manager env, then run management command
          gcloud run jobs update scrape-vacancy \
            --image="${IMAGE}" \
            --command=python3 \
            --args=scripts/materialize_fetcher_config_and_scrape.py \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --quiet

          # TV scraper: standard Django entrypoint
          gcloud run jobs update scrape-tv-programs \
            --image="${IMAGE}" \
            --command=python \
            --args=manage.py,scrape_tv_programs \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --quiet
