name: Require staging first

# Gate for PRs into `main`: production may only receive code
# already merged into the `staging` branch — the invariant is
# main ⊆ staging, so only staging may be ahead. The check is
# PR-metadata-based: the PR's exact head SHA must be
# associated with a MERGED PR into `staging`. That works with
# squash-merged staging PRs, whose head commits never become
# git ancestors of `staging`. See AGENTS.md
# "Git workflow — staging-first".
#
# `pull_request_target` (not `pull_request`) so the gate runs
# this file as it exists on `main` — a gated PR cannot
# weaken the check that gates it. Safe because the job never
# checks out PR code and the token stays read-only. `edited`
# re-fires when a PR is retargeted to `main`. Caveat: the
# check only runs once this file exists on `main`.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: staging-first-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  staging-first:
    runs-on: ubuntu-latest
    steps:
      - name: Verify head was merged into staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # A staging→main PR — or a `staging2`-style branch
          # whose head IS the staging tip — would pass the
          # SHA check below on a technicality (the tip IS a
          # staging merge commit) while dragging integration
          # noise into main; promotion goes through
          # Promote-to-main. The tip lookup fails closed:
          # an empty stg_tip would silently skip the guard
          # and the fallback check below would then pass a
          # staging merge commit via its own staging PR.
          stg_tip=$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/staging" \
            --jq .commit.sha </dev/null) || {
            echo "::error::staging-tip lookup failed —"
            echo "::error::failing closed; re-run the job."
            exit 1
          }
          if [ "$HEAD_REF" = "staging" ] || \
             [ "$HEAD_SHA" = "$stg_tip" ]; then
            echo "::error::staging→main PRs are not allowed."
            echo "::error::Promote staged branches with the"
            echo "::error::Promote-to-main workflow instead —"
            echo "::error::see AGENTS.md 'Git workflow —"
            echo "::error::staging-first'."
            exit 1
          fi
          # Pulls associated with the head SHA, filtered to a
          # MERGED staging PR — O(1) lookup, no paging over
          # merged-PR history (per_page=100 is headroom; a
          # commit is never in 100+ PRs). -X GET is required:
          # bare `-f` would make gh api POST and 404. A newer
          # head SHA that was never staged correctly fails;
          # identical code under a different branch name
          # correctly passes. If this PR opened in the same
          # seconds as the staging merge, GitHub's commit→PR
          # association index can lag — re-run the job once.
          # Fork PRs hard-fail by design: their head SHA is
          # not a commit of this repo → the API lookup 404s.
          # External contributions must land via staging
          # first regardless of the check.
          resp=$(gh api -X GET \
            "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
            -f per_page=100) || {
            echo "::error::GitHub API error listing PRs for $HEAD_SHA"
            echo "::error::(fork PR heads are not commits of"
            echo "::error::this repo and fail by design —"
            echo "::error::contribute via a staging PR first)"
            exit 1
          }
          count=$(jq '[.[] | select(.merged_at != null and
            .base.ref == "staging")] | length' <<<"$resp" || echo 0)
          if [ "$count" -gt 0 ]; then
            echo "OK: head $HEAD_SHA is already on staging."
            exit 0
          fi
          echo "::error::PR targets main but head $HEAD_SHA was"
          echo "::error::never merged into staging."
          echo "Open a PR from this branch with --base staging,"
          echo "merge it once checks are green, and this check"
          echo "passes. If the branch moved since the staging"
          echo "merge, merge the new head into staging too."
          echo "See AGENTS.md 'Git workflow — staging-first'."
          exit 1
