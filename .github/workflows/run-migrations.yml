name: Run database migrations

on:
  workflow_run:
    workflows:
      # '+' is a glob metachar in on.workflow_run.workflows matching;
      # it must be escaped or the pattern never matches the upstream name
      - 'Deploy scraper jobs (Artifact Registry \+ Cloud Run)'
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: run-migrations-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: europe-north1

jobs:
  check-migrations-changed:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      migrations_changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check if migration files changed
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q 'migrations/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  run-migrations:
    needs: check-migrations-changed
    if: >
      needs.check-migrations-changed.outputs.migrations_changed == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run migrations via Cloud Run Job
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/industry-analyser:latest"

          # Delete existing job if it exists to ensure fresh configuration
          if gcloud run jobs describe run-migrations --region="${REGION}" --project="${PROJECT_ID}" &>/dev/null; then
            gcloud run jobs delete run-migrations \
              --region="${REGION}" \
              --project="${PROJECT_ID}" \
              --quiet
          fi

          # Create fresh migration job with current configuration.
          # All config ships in the single `env-file` secret, injected
          # as DOTENV (settings.py loads it like a .env file).
          gcloud run jobs create run-migrations \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --command=python \
            --args=manage.py,migrate \
            --set-secrets="DOTENV=env-file:latest" \
            --task-timeout=3600 \
            --max-retries=0 \
            --quiet

          # Execute and wait for completion
          gcloud run jobs execute run-migrations \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --wait \
            --quiet

          echo "Migrations completed successfully."
