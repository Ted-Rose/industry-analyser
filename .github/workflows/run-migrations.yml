name: Run database migrations

on:
  workflow_run:
    workflows:
      - "Deploy scraper jobs (Artifact Registry + Cloud Run)"
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: run-migrations-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: europe-north1

jobs:
  check-migrations-changed:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      migrations_changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if migration files changed
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q 'migrations/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  run-migrations:
    needs: check-migrations-changed
    if: >
      needs.check-migrations-changed.outputs.migrations_changed == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run migrations via Cloud Run Job
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          ENV_SECRET_KEY: ${{ secrets.TF_VAR_secret_key }}
          ENV_DATABASE_URL: ${{ secrets.TF_VAR_database_url }}
          ENV_BASE_URL: ${{ secrets.TF_VAR_base_url }}
          ENV_DB_SSL_CERT: ${{ secrets.TF_VAR_db_ssl_cert }}
        run: |
          set -euo pipefail

          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/industry-analyser-app/industry-analyser:latest"

          # Create or update a one-off migration job
          if gcloud run jobs describe run-migrations --region="${REGION}" --project="${PROJECT_ID}" &>/dev/null; then
            gcloud run jobs update run-migrations \
              --image="${IMAGE}" \
              --region="${REGION}" \
              --project="${PROJECT_ID}" \
              --command=python \
              --args=manage.py,migrate \
              --quiet
          else
            gcloud run jobs create run-migrations \
              --image="${IMAGE}" \
              --region="${REGION}" \
              --project="${PROJECT_ID}" \
              --command=python \
              --args=manage.py,migrate \
              --update-env-vars="SECRET_KEY=${ENV_SECRET_KEY}" \
              --update-env-vars="DATABASE_URL=${ENV_DATABASE_URL}" \
              --update-env-vars="BASE_URL=${ENV_BASE_URL}" \
              --update-env-vars="DB_SSL_CERT=${ENV_DB_SSL_CERT}" \
              --update-env-vars="DEBUG=False" \
              --max-retries=0 \
              --quiet
          fi

          # Execute and wait for completion
          gcloud run jobs execute run-migrations \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --wait \
            --quiet

          echo "Migrations completed successfully."
