# Repository settings for industry-analyser
# Declarative config for the Probot Settings app:
# https://probot.github.io/apps/settings/
# NOTE: this file only takes effect if the Settings app is
# installed on the repo — otherwise it is documentation of the
# intended configuration (applied manually via `gh api`).

repository:
  # Repository name
  name: industry-analyser

  # Description
  description: >-
    Project for different industry analysis

  # Homepage URL (Vercel deployment)
  homepage: https://industryanalyser.vercel.app

  # Repository visibility (public or private)
  private: false

  # Enable/disable features
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: false

  # Default branch
  default_branch: main

  # Squash-only merges (current repo setting)
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: false

  # Automatically delete head branches after PR merge
  delete_branch_on_merge: true

  # Enable automated security fixes (disabled on the live repo)
  enable_automated_security_fixes: false
  enable_vulnerability_alerts: true

# Branch protection rules
branches:
  - name: main
    protection:
      # No review requirement (matches the current classic
      # protection shape — merges rely on required checks).
      required_pull_request_reviews: null

      # Require status checks to pass before merging.
      # `frontend` and `openspec-validate` run on every PR.
      required_status_checks:
        strict: false
        contexts:
          - frontend
          - openspec-validate

      # Enforce restrictions for administrators
      enforce_admins: false

      # Require linear history
      required_linear_history: false

      # Allow force pushes
      allow_force_pushes: false

      # Allow deletions
      allow_deletions: false
