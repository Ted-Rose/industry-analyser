{% load static %}
<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>{% block title %}Ziņu kopsavilkums{% endblock %}</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 1rem;
      color: #1a1a1a;
      line-height: 1.5;
    }
    header h1 { font-size: 1.4rem; margin-bottom: 0.2rem; }
    header h1 a { color: inherit; text-decoration: none; }
    .digest { margin-bottom: 2rem; }
    .muted { color: #666; font-size: 0.9rem; }
    .item { margin-bottom: 1.5rem; }
    .item h3 { margin-bottom: 0.2rem; }
    ul.articles { padding-left: 1.2rem; }
    nav.back { margin-bottom: 1rem; }
    nav.back a { margin-right: 1rem; }
    .story-toggle {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: #0645ad;
      cursor: pointer;
      text-align: left;
    }
    .story-toggle:hover { text-decoration: underline; }
    .story-slot { margin: 0.5rem 0 1rem; }
    .story-card {
      border-left: 3px solid #ddd;
      padding-left: 0.8rem;
    }
    .story-card img { max-width: 100%; height: auto; }
    .story-card h4 { margin-bottom: 0.3rem; }
    .story-switcher a { margin-right: 0.6rem; }
    table.prefs td { padding: 0.2rem 0.6rem 0.2rem 0; }
    .audio-bar { margin-bottom: 1rem; }
    .audio-btn {
      background: none;
      border: none;
      padding: 0 0.2rem;
      font: inherit;
      color: #0645ad;
      cursor: pointer;
    }
    .audio-btn:hover { text-decoration: underline; }
    .audio-btn[data-state="loading"]::after { content: '⏳'; }
    .audio-btn[data-state="error"] { color: #999; }
    .audio-btn[data-state="error"]::after { content: '⚠'; }
    .audio-stop { font: inherit; cursor: pointer; }
  </style>
  <script src="{% static 'news/story.js' %}" defer></script>
  <script src="{% static 'news/audio.js' %}" defer></script>
</head>
<body>
  <header>
    <h1><a href="{% url 'news:digest-list' %}">Ziņu kopsavilkums</a></h1>
    <nav class="back">
      <a href="/">&larr; Apps</a>
      {% if request.user.is_authenticated %}
        <a href="{% url 'news:preferences' %}">Portālu izvēle</a>
      {% else %}
        <a class="muted" href="{% url 'news:preferences' %}">
          Log in to rank portals</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
