<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>{% block title %}Ziņu kopsavilkums{% endblock %}</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 1rem;
      color: #1a1a1a;
      line-height: 1.5;
    }
    header h1 { font-size: 1.4rem; margin-bottom: 0.2rem; }
    header h1 a { color: inherit; text-decoration: none; }
    .digest { margin-bottom: 2rem; }
    .muted { color: #666; font-size: 0.9rem; }
    .item { margin-bottom: 1.5rem; }
    .item h3 { margin-bottom: 0.2rem; }
    ul.articles { padding-left: 1.2rem; }
    nav.back { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{% url 'news:digest-list' %}">Ziņu kopsavilkums</a></h1>
    <nav class="back"><a href="/">&larr; Apps</a></nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
